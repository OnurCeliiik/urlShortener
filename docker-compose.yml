services:
  postgres:
    image: postgres:16-alpine
    container_name: urlshortener-postgres
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: urlshortener
    ports:
      - "5433:5432"
    volumes:
      - urlshortener_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  urlshortener_pgdata:
